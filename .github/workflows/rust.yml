name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same PR or branch makes the running checks obsolete. Cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS: a Linux failure must not cancel the Windows build.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
        - os: macos-latest
        - os: ubuntu-latest
        - os: windows-latest
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: true
    # stormlib-sys links the system zlib and bzip2 on Linux.
    - name: Install system libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libbz2-dev zlib1g-dev
    - name: Run tests
      run: cargo test --all
